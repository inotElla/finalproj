<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 40px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 14px;
            box-sizing: border-box;
        }
        #message {
            background: #f2f2f2;
            padding: 12px;
            display: none;
        }
        .valid { color: green; }
        .invalid { color: #c62828; }
    </style>
</head>
<body>
    <h2>Enter personal information</h2>

    <label for="email">Enter Email</label>
    <input type="text" id="email" placeholder="Enter your email address">

    <div id="message1">

    </div>

    <label for="password">Enter Password</label>
    <input type="password" id="password" placeholder="Enter password">
 
    <div id="message2">
        <p id="lower" class="invalid">A lowercase letter</p>
        <p id="upper" class="invalid">An uppercase letter</p>
        <p id="number" class="invalid">A number</p>
        <p id="length" class="invalid">At least 8 characters</p>
    </div>

    
 
    <script>
        const password = document.getElementById("password");
        const message = document.getElementById("message1");
 
        password.addEventListener("focus", function () {
            message.style.display = "block";
        });
 
        password.addEventListener("blur", function () {
            message.style.display = "none";
        });
 
        password.addEventListener("input", function () {
            setRule("lower", /[a-z]/.test(password.value));
            setRule("upper", /[A-Z]/.test(password.value));
            setRule("number", /[0-9]/.test(password.value));
            setRule("length", password.value.length >= 8);
        });
 
        function setRule(id, passed) {
            const item = document.getElementById(id);
            item.classList.toggle("valid", passed);
            item.classList.toggle("invalid", !passed);
        }
    </script>
</body>
</html>
